# Packages shown as cards on software.qmd (template: software.ejs)
- title: ggtrace
  image: https://yjunechoe.github.io/ggtrace/logo.png
  role: Maintainer, Author
  languages: [R]
  description: >-
    Programmatically explore, debug, and manipulate ggplot internals. A low-level
    interface that extends base R's trace, plus workflow functions that make
    ggplot internals more accessible.
  links:
    - {text: GitHub, href: "https://github.com/yjunechoe/ggtrace"}
    - {text: Website, href: "https://yjunechoe.github.io/ggtrace"}
    - {text: "useR! 2022 talk", href: "https://www.youtube.com/watch?v=2JX8zu4QxMg&t=2959s"}
    - {text: "rstudio::conf 2022 talk", href: "https://www.rstudio.com/conference/2022/talks/cracking-open-ggplot-internals-ggtrace/"}
    - {text: Paper, href: "https://yjunechoe.github.io/static/papers/Choe_2022_SublayerGG.pdf"}

- title: jlmerclusterperm
  image: https://yjunechoe.github.io/jlmerclusterperm/logo.png
  role: Maintainer, Author
  languages: [R, Julia]
  description: >-
    Fast cluster-based permutation analysis for densely-sampled time data, with
    (generalized, mixed-effects) regression models. Uses MixedModels.jl and GLM.jl
    through JuliaConnectoR.
  links:
    - {text: CRAN, href: "https://cran.r-project.org/package=jlmerclusterperm"}
    - {text: GitHub, href: "https://github.com/yjunechoe/jlmerclusterperm/"}
    - {text: Website, href: "https://yjunechoe.github.io/jlmerclusterperm/"}

